name: Terraform

on:
  repository_dispatch:
    types:
      - deploy

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: senti_dockerhub

    steps:
      - name: Terraform pipeline triggered
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
            echo "Service: $SERVICE"
            echo "Image tag: $TAG"

      - name: Map service to image tag variable
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
            case "$SERVICE" in
              senti-datos-personales|senti-datos-personales-ms) VAR_NAME="senti_datos_personales_image_tag" ;;
              senti-geolocalizacion|senti-geolocalizacion-ms)   VAR_NAME="senti_geolocalizacion_image_tag" ;;
              senti-gestion-robos|senti-gestion-robos-ms)       VAR_NAME="senti_gestion_robos_image_tag" ;;
              senti-notificacion|senti-notificacion-ms)         VAR_NAME="senti_notificacion_image_tag" ;;
              *) echo "Unknown service: $SERVICE"; exit 1 ;;
            esac
            # Terraform reads TF_VAR_<name> from the environment for the remaining steps
            echo "TF_VAR_${VAR_NAME}=${TAG}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

