name: Terraform

on:
  repository_dispatch:
    types:
      - deploy

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: senti_dockerhub

    # Shared by the plan and apply steps.
    env:
      # App registration Terraform uses to authenticate against Azure
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_servicebus_connection_string: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
      TF_VAR_firebase_credentials_json: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

    steps:
      - name: Terraform pipeline triggered
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
            echo "Service: $SERVICE"
            echo "Image tag: $TAG"

      - name: Map service to image tag variable
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
            case "$SERVICE" in
              senti-datos-personales|senti-datos-personales-ms) VAR_NAME="senti_datos_personales_image_tag" ;;
              senti-geolocalizacion|senti-geolocalizacion-ms)   VAR_NAME="senti_geolocalizacion_image_tag" ;;
              senti-gestion-robos|senti-gestion-robos-ms)       VAR_NAME="senti_gestion_robos_image_tag" ;;
              senti-notificacion|senti-notificacion-ms)         VAR_NAME="senti_notificacion_image_tag" ;;
              *) echo "Unknown service: $SERVICE"; exit 1 ;;
            esac
            # Terraform reads TF_VAR_<name> from the environment for the remaining steps
            echo "TF_VAR_${VAR_NAME}=${TAG}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # - name: Terraform Apply
      #   run: terraform apply -auto-approve

